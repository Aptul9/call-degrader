<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>call-degrader</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
  <h1>call-degrader</h1>
  <div id="status" class="status">
    <span class="pill" id="pill-state">live</span>
    <span class="pill" id="pill-link">link off</span>
    <span class="pill" id="pill-fps">0 fps</span>
    <span class="pill" id="pill-vcam">no virtual camera</span>
    <span class="pill" id="pill-audio">audio off</span>
  </div>
</header>

<main>

  <div class="preview">
    <img id="preview" src="/preview.mjpg" alt="camera preview">
    <div id="stall-flash" class="stall-flash"></div>
  </div>

  <div class="pedal">
    <button id="btn-record" class="btn btn-rec">hold to record</button>
    <button id="btn-live" class="btn">back to live</button>
    <button id="btn-clear" class="btn btn-quiet">clear loop</button>
    <span class="meters">
      <label>mic<span class="meter"><i id="meter-in"></i></span></label>
      <label>out<span class="meter"><i id="meter-out"></i></span></label>
    </span>
  </div>

  <!-- everything above the fold is what gets touched during a call -->

  <section class="quick">
    <div class="presets" id="presets"></div>

    <div class="picks">
      <label class="pick">
        <span>camera</span>
        <select id="camera-pick"></select>
      </label>
      <button id="btn-rescan" class="btn btn-quiet btn-small" type="button">rescan</button>
      <label class="pick">
        <span>loop style</span>
        <select id="loop-pick"></select>
      </label>
    </div>

    <div class="checks" id="quick-checks"></div>

    <p class="hint" id="hotkey-hint"></p>
  </section>

  <!-- set once, then folded away -->

  <details class="fold" data-fold="line">
    <summary>line detail<span class="sub">quality band, stalls, delay</span></summary>
    <div class="grid" id="group-link"></div>
  </details>

  <details class="fold" data-fold="video">
    <summary>video effects<span class="sub">how hard each one reacts</span></summary>
    <div class="grid" id="group-video"></div>
  </details>

  <details class="fold" data-fold="audio">
    <summary>audio effects<span class="sub">how hard each one reacts</span></summary>
    <div class="grid" id="group-audio"></div>
  </details>

  <details class="fold" data-fold="pedal">
    <summary>pedal timing<span class="sub">recording length, crossfade, ghost opacity</span></summary>
    <div class="grid" id="group-pedal"></div>
  </details>

  <details class="fold" data-fold="devices">
    <summary>audio routing<span class="sub">point the system microphone at the cable</span></summary>
    <div class="row">
      <button id="btn-route" class="btn btn-quiet">point system mic at CABLE Output</button>
      <span id="route-result" class="note"></span>
    </div>
    <div class="grid" id="group-devices"></div>
  </details>

  <p class="note" id="errors"></p>

</main>

<script src="/static/app.js"></script>
</body>
</html>
